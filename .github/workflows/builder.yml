name: Build add-on image

on:
  workflow_dispatch:
    inputs:
      addon:
        description: Add-on directory
        required: true
        default: carconnectivity-addon

  workflow_call:
    inputs:
      addon:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read add-on metadata
        id: meta
        env:
          ADDON: ${{ inputs.addon || github.event.inputs.addon }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import os, yaml, json

          addon = os.environ["ADDON"]
          owner = os.environ["OWNER"].lower()

          with open(f"{addon}/config.yaml") as f:
              config = yaml.safe_load(f)

          with open(f"{addon}/build.yaml") as f:
              build = yaml.safe_load(f) or {}

          version = str(config["version"]).strip('"')
          archs = config["arch"]

          platform_map = {
              "amd64": "linux/amd64",
              "aarch64": "linux/arm64",
              "armv7": "linux/arm/v7",
              "armhf": "linux/arm/v6",
              "i386": "linux/386",
          }

          platforms = [platform_map[a] for a in archs]

          # For a true multi-arch build, all arches should use compatible BUILD_FROM.
          # We pass BUILD_FROM from the first arch, which is fine for many HA base images.
          build_from = (build.get("build_from") or {}).get(archs[0])
          if not build_from:
              raise SystemExit(f"Missing build_from for {archs[0]}")

          args = {
              "BUILD_FROM": build_from,
              "BUILD_VERSION": version,
              "BUILD_ARCH": archs[0],
              **(build.get("args") or {}),
          }

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"addon={addon}\n")
              out.write(f"owner={owner}\n")
              out.write(f"version={version}\n")
              out.write(f"platforms={','.join(platforms)}\n")
              out.write("build_args<<EOF\n")
              for k, v in args.items():
                  out.write(f"{k}={v}\n")
              out.write("EOF\n")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.addon }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ steps.meta.outputs.addon }}
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: ${{ steps.meta.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false